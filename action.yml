name: patchnow
description: Exploited-vulnerability response, automated. OSV + CISA KEV + EPSS scan, patch.yml policy, pre-approved actions.
author: PATCH contributors
branding:
  icon: shield
  color: green
inputs:
  config:
    description: Path to the policy file, relative to working-directory.
    default: patch.yml
  working-directory:
    description: Repository directory to scan.
    default: .
  dry-run:
    description: Force a dry run even if the policy is armed.
    default: "false"
  sarif:
    description: Where to write the SARIF report, relative to working-directory.
    default: patchnow.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "true"
  github-token:
    description: Token used by pin_patch to push the branch and open pull requests.
    default: ${{ github.token }}
  persist-state:
    description: Cache .patchnow/ (dedupe state and audit log) between runs with actions/cache.
    default: "true"
outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ steps.run.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Install patchnow
      shell: bash
      working-directory: ${{ github.action_path }}/patchnow
      run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts
    - name: Restore state
      if: inputs.persist-state == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.patchnow
        key: patchnow-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: patchnow-state-
    - name: patchnow run
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PATCHNOW_DRY_RUN: ${{ inputs.dry-run }}
        PATCHNOW_CONFIG: ${{ inputs.config }}
        PATCHNOW_SARIF: ${{ inputs.sarif }}
        PATCHNOW_BIN: ${{ github.action_path }}/patchnow/bin/patchnow.js
      run: |
        args=(run --config "$PATCHNOW_CONFIG" --sarif "$PATCHNOW_SARIF")
        if [ "$PATCHNOW_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        echo "sarif=${{ inputs.working-directory }}/$PATCHNOW_SARIF" >> "$GITHUB_OUTPUT"
        node "$PATCHNOW_BIN" "${args[@]}"
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: patchnow
